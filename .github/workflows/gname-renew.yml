name: gname-auto-renew

# 本文件放在【公开库】，代码在【私有库】：
#   - 公开库 Actions 免费时长不限（私有库每月仅 2000 分钟）
#   - 需要在公开库配置（Settings → Secrets and variables → Actions）：
#       Variables 页：GNAME_PRIVATE_REPO  = 你的用户名/私库名（必填）
#       Secrets  页：PRIVATE_REPO_TOKEN = 访问私库的 PAT（必填）
#                    GNAME_ACCOUNTS     = 多行「邮箱:密码」（正式续期用）
#                    GNAME_PROXY        = 家宽代理链接（hy2/tuic 会自动装官方客户端）
#   - 脚本本体与各账号休眠状态 state.json 留在私库
#
# ⚠️ 重要：Gname 登录需要人工输入图片验证码（且风控可能追加滑块），
#    无人值守的 Actions 无法完成登录。定时任务的行为：
#      - 账号在 60 天休眠期内：直接跳过（不登录、不请求 Gname，绿色）
#      - 休眠到期需要续期：输出 ⚠ 警告注解提醒本地执行（任务保持绿色）
#      - 真实错误（网络/接口异常）：标红
#    即定时任务 = "到期提醒器"；正式续期请在本地/家宽设备运行。
#    设变量 GNAME_FAIL_ON_MANUAL=1 可让"需要人工"也标红。

on:
  schedule:
    # 每天 UTC 01:17（北京时间 09:17）触发；脚本自身有 60 天休眠控制，
    # 休眠期内会直接跳过，不会请求 Gname
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑模式（只查询不提交续期）"
        type: boolean
        required: false
        default: false
      force:
        description: "跳过 60 天休眠，立即执行"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: gname-auto-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check config
        run: |
          if [ -z "${{ vars.GNAME_PRIVATE_REPO }}" ]; then
            echo "❌ 未配置仓库变量 GNAME_PRIVATE_REPO，checkout 不知道要拉哪个私库。"
            echo "请在公开库 Settings → Secrets and variables → Actions → Variables 页："
            echo "  New repository variable"
            echo "    Name:  GNAME_PRIVATE_REPO"
            echo "    Value: 你的GitHub用户名/私库名（例如 zhangsan/gname-renew-private）"
            exit 1
          fi
          echo "将拉取私库：${{ vars.GNAME_PRIVATE_REPO }}"

      - name: Checkout private script repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GNAME_PRIVATE_REPO }}
          ref: main                                          # 私库默认分支不是 main 就改这里
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}           # PAT：需对该私库有 Contents 读写权限
          path: script

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 家宽代理：GNAME_PROXY 为 hysteria2/hy2/tuic 链接时，自动下载官方客户端并后台
      # 启动，脚本流量统一经 127.0.0.1:11080 的 SOCKS5 转发；socks5/http 代理无需此步；
      # 留空则整步跳过
      - name: Setup proxy client (hysteria2/tuic)
        env:
          GNAME_PROXY: ${{ secrets.GNAME_PROXY }}
        run: |
          if [ -z "$GNAME_PROXY" ]; then echo "未配置 GNAME_PROXY，跳过代理客户端"; exit 0; fi
          SCHEME=$(printf '%s' "$GNAME_PROXY" | sed -n 's#^\([A-Za-z0-9]*\)://.*#\1#p' | tr 'A-Z' 'a-z')
          python script/gname_auto_renew.py --gen-config --proxy "$GNAME_PROXY"
          case "$SCHEME" in
            hysteria2|hy2)
              curl -sSfL https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -o /usr/local/bin/hysteria
              chmod +x /usr/local/bin/hysteria
              nohup hysteria client -c script/hysteria2_client.json > hysteria.log 2>&1 &
              ;;
            tuic)
              URL=$(curl -s https://api.github.com/repos/EAimTY/tuic/releases/latest | grep -o 'https://[^"]*linux[^"]*musl[^"]*\.tar\.gz' | head -n1)
              if [ -z "$URL" ]; then echo "未找到 tuic 的 Linux 包，请到 EAimTY/tuic Releases 核对资产名"; exit 1; fi
              curl -sSfL "$URL" -o /tmp/tuic.tgz && mkdir -p /tmp/tuic && tar -xzf /tmp/tuic.tgz -C /tmp/tuic
              BIN=$(find /tmp/tuic -type f -name 'tuic*' | head -n1)
              if [ -z "$BIN" ]; then echo "解压后未找到 tuic 可执行文件"; exit 1; fi
              chmod +x "$BIN" && cp "$BIN" /usr/local/bin/tuic-client
              nohup tuic-client -c script/tuic_client.json > tuic.log 2>&1 &
              ;;
            *) echo "socks5/http 代理无需本地客户端"; exit 0 ;;
          esac
          for i in $(seq 1 30); do
            if python -c "import socket;socket.create_connection(('127.0.0.1',11080),1)" 2>/dev/null; then
              echo "本地 SOCKS5 127.0.0.1:11080 已就绪"; break
            fi
            [ "$i" = "30" ] && { echo "❌ 客户端 30 秒未就绪，日志："; tail -n 30 hysteria.log tuic.log 2>/dev/null; exit 1; }
            sleep 1
          done

      - name: Run auto renew
        env:
          # 多账号（每行「邮箱:密码」或「名称:邮箱:密码」，# 为注释；密码可含冒号）
          GNAME_ACCOUNTS: ${{ secrets.GNAME_ACCOUNTS }}
          GNAME_PROXY: ${{ secrets.GNAME_PROXY }}
          # 按需覆盖：
          # GNAME_DAYS_BEFORE: "90"
          # GNAME_SLEEP_DAYS: "60"
          # GNAME_ACCOUNT_DELAY: "5"
          # GNAME_FAIL_ON_MANUAL: "1"
          # GNAME_SUFFIXES: "eu.cc"
          # GNAME_DOMAINS: "a.eu.cc,b.eu.cc"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python script/gname_auto_renew.py $ARGS

      - name: Persist hibernation state
        if: success()
        working-directory: script
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: renew hibernation state [skip ci]"
            git push
          fi
