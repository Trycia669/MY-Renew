name: gname-auto-renew

# 本文件放在【公开库】，代码在【私有库】：
#   - 公开库 Actions 免费时长不限（私有库每月仅 2000 分钟）
#   - 需要在公开库配置（Settings → Secrets and variables → Actions）：
#       Variables 页：GNAME_PRIVATE_REPO  = 你的用户名/私库名（必填）
#       Secrets  页：PRIVATE_REPO_TOKEN = 访问私库的 PAT（必填）
#                    GNAME_ACCOUNTS     = 多行「邮箱:密码」（正式续期用）
#                    GNAME_PROXY        = 家宽代理链接（可选）
#   - 脚本本体与各账号休眠状态 state.json 留在私库
#
# ⚠️ 重要：Gname 登录需要人工输入图片验证码（且风控可能追加滑块），
#    无人值守的 Actions 无法完成登录，定时任务里的正式续期会失败。
#    密码登录模式建议在本地/家宽设备运行；Actions 适合 --dry-run 观察
#    或在休眠期内跳过。详见私库 README「无人值守限制」章节。

on:
  schedule:
    # 每天 UTC 01:17（北京时间 09:17）触发；脚本自身有 60 天休眠控制，
    # 休眠期内会直接跳过，不会请求 Gname
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑模式（只查询不提交续期）"
        type: boolean
        required: false
        default: false
      force:
        description: "跳过 60 天休眠，立即执行"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: gname-auto-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check config
        run: |
          if [ -z "${{ vars.GNAME_PRIVATE_REPO }}" ]; then
            echo "❌ 未配置仓库变量 GNAME_PRIVATE_REPO，checkout 不知道要拉哪个私库。"
            echo "请在公开库 Settings → Secrets and variables → Actions → Variables 页："
            echo "  New repository variable"
            echo "    Name:  GNAME_PRIVATE_REPO"
            echo "    Value: 你的GitHub用户名/私库名（例如 zhangsan/gname-renew-private）"
            exit 1
          fi
          echo "将拉取私库：${{ vars.GNAME_PRIVATE_REPO }}"

      - name: Checkout private script repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GNAME_PRIVATE_REPO }}
          ref: main                                          # 私库默认分支不是 main 就改这里
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}           # PAT：需对该私库有 Contents 读写权限
          path: script

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 可选：如用 hysteria2/tuic 家宽代理，先安装官方客户端并后台启动。
      # 需要：secrets 里配置 GNAME_PROXY（代理链接），并放开下面两段注释。
      # - name: Generate proxy client config
      #   run: python script/gname_auto_renew.py --gen-config --proxy "$GNAME_PROXY"
      #   env:
      #     GNAME_PROXY: ${{ secrets.GNAME_PROXY }}
      # - name: Start hysteria2 client
      #   run: |
      #     curl -sSfL https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -o /usr/local/bin/hysteria
      #     chmod +x /usr/local/bin/hysteria
      #     nohup hysteria client -c script/hysteria2_client.json >/dev/null 2>&1 &

      - name: Run auto renew
        env:
          # 多账号（每行「邮箱:密码」或「名称:邮箱:密码」，# 为注释；密码可含冒号）
          GNAME_ACCOUNTS: ${{ secrets.GNAME_ACCOUNTS }}
          GNAME_PROXY: ${{ secrets.GNAME_PROXY }}
          # 按需覆盖：
          # GNAME_DAYS_BEFORE: "90"
          # GNAME_SLEEP_DAYS: "60"
          # GNAME_ACCOUNT_DELAY: "5"
          # GNAME_SUFFIXES: "eu.cc"
          # GNAME_DOMAINS: "a.eu.cc,b.eu.cc"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python script/gname_auto_renew.py $ARGS

      - name: Persist hibernation state
        if: success()
        working-directory: script
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: renew hibernation state [skip ci]"
            git push
          fi
