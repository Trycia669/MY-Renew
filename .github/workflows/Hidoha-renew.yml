name: Hidoha Auto Renew

on:
  schedule:
    # 每 3 天 UTC 0点跑一次(北京时间早上 8 点),按需修改
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点击运行,方便调试

# 这个 workflow 放在【公开】仓库里,真正的 renew.py 放在【私有】仓库里,
# 运行时用一个有权限的 token 把私有仓库的代码拉进来再执行,
# 这样公开仓库里除了这份 workflow 文件本身,不会暴露任何脚本细节。
permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取本仓库(公开仓库,只有这份 workflow 文件)
        uses: actions/checkout@v4

      - name: 拉取私有仓库里的续期脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}        # 例如 yourname/hidoha-renew-script
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}     # 有权限读取该私有仓库的 PAT
          path: private-script

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r private-script/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 设置代理(可选)
        run: |
          set -e
          if [ -n "${{ secrets.HIDOHA_PROXY_OUTBOUND }}" ]; then
            echo "检测到 HIDOHA_PROXY_OUTBOUND,使用 sing-box 起本地代理(支持 VLESS/Hysteria2/TUIC/Trojan/Shadowsocks 等)"

            SB_VERSION="1.9.3"
            curl -fsSL -o sing-box.tar.gz \
              "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
            tar -xzf sing-box.tar.gz
            SB_DIR=$(tar -tzf sing-box.tar.gz | head -1 | cut -f1 -d"/")
            chmod +x "$SB_DIR/sing-box"

            # 给用户传进来的 outbound JSON 补一个 tag,再拼成完整的 sing-box 配置
            echo '${{ secrets.HIDOHA_PROXY_OUTBOUND }}' | jq '. + {tag:"proxy"}' > outbound.json
            jq -n --slurpfile outbound outbound.json '{
              log: {level: "warn"},
              inbounds: [{type:"socks", listen:"127.0.0.1", listen_port:1080}],
              outbounds: $outbound,
              route: {final: "proxy"}
            }' > singbox-config.json

            nohup "./$SB_DIR/sing-box" run -c singbox-config.json > singbox.log 2>&1 &
            sleep 3
            echo "----- sing-box 启动日志 -----"
            cat singbox.log || true
            echo "HIDOHA_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"

          elif [ -n "${{ secrets.HIDOHA_PROXY }}" ]; then
            echo "使用普通 http/https/socks5 代理"
            echo "HIDOHA_PROXY=${{ secrets.HIDOHA_PROXY }}" >> "$GITHUB_ENV"

          else
            echo "未配置代理,直接用 runner 自身出口 IP"
          fi

      - name: 运行续期脚本
        working-directory: private-script
        env:
          # 多账号模式:HIDOHA_ACCOUNTS 是一个 JSON 数组字符串,例如
          # [{"name":"账号A","email":"a@x.com","password":"pw1","order_id":"2921"}]
          # 配置了 HIDOHA_ACCOUNTS 就会忽略下面三个单账号变量。
          HIDOHA_ACCOUNTS: ${{ secrets.HIDOHA_ACCOUNTS }}
          # 单账号模式(没配 HIDOHA_ACCOUNTS 时的兼容写法):
          HIDOHA_EMAIL: ${{ secrets.HIDOHA_EMAIL }}
          HIDOHA_PASSWORD: ${{ secrets.HIDOHA_PASSWORD }}
          HIDOHA_ORDER_ID: ${{ secrets.HIDOHA_ORDER_ID }}
          HIDOHA_RENEW_THRESHOLD_DAYS: ${{ vars.HIDOHA_RENEW_THRESHOLD_DAYS }}
          HIDOHA_SUCCESS_DAYS_DELTA: ${{ vars.HIDOHA_SUCCESS_DAYS_DELTA }}
          # HIDOHA_PROXY 不在这里写死了,由上一步"设置代理"按情况写进 GITHUB_ENV
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 这个仓库本身就是公开仓库,固定用 public 模式,日志/通知自动脱敏
          MODE: public
        run: python renew.py

      - name: 更新时间戳(防止本仓库超过 60 天无活动导致 Actions 被自动停用)
        if: always()
        run: |
          mkdir -p .github
          echo "Last run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_run.txt
          git diff --cached --quiet || git commit -m "chore: update last run timestamp [skip ci]"
          git push

      - name: 清理历史 workflow 运行记录(只保留本次)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW_FILE="Hidoha-renew.yml"
          CURRENT_RUN_ID="${{ github.run_id }}"
          echo "当前 run id: $CURRENT_RUN_ID,开始清理历史记录..."
          RUN_IDS=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_FILE" --json databaseId --limit 100 --jq '.[].databaseId')
          for id in $RUN_IDS; do
            if [ "$id" != "$CURRENT_RUN_ID" ]; then
              echo "删除历史运行记录: $id"
              gh run delete "$id" --repo "$REPO" || echo "  -> 删除失败(可能权限不足),跳过"
            fi
          done
